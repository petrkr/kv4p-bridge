[log]
level = "INFO"

[kv4p]
# Empty device keeps the KV4P serial transport disabled. Useful for dummy smoke tests.
device = ""
baudrate = 115200
rx_audio_open = true
status_reports = true

[kv4p.radio]
rx_freq = 145.500
tx_freq = 145.500
bandwidth = "25k"
squelch = 1
ctcss_rx = 0
ctcss_tx = 0
high_power = false
tx_allowed = false
rssi = false
filter_pre = false
filter_high = false
filter_low = false

[connector]
type = "dummy"

[connector.dummy]
log_rx_audio = true
log_rx_audio_every = 100

# Alternative: live playback/capture via the system soundcard.
# Requires the optional 'audio' extra: pip install kv4p-bridge[audio]
#
# [connector]
# type = "audio"
#
# [connector.audio]
# # Device index or name understood by sounddevice/PortAudio.
# # Leave unset to use the system default input/output device.
# input_device = ""
# output_device = ""
#
# Runtime stdin commands: p = toggle PTT, 0-8 = set squelch level.
